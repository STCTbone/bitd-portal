project_id = "bitd-portal"
[api]
enabled = true
port = 54321
schemas = ["public", "bitd", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54322
shadow_port = 54320
major_version = 17
[db.migrations]
enabled = true
[db.seed]
enabled = false
[realtime]
enabled = true
[studio]
enabled = false
[local_smtp]
enabled = false
[storage]
enabled = true
file_size_limit = "20MiB"
[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
enable_signup = true
enable_anonymous_sign_ins = true
enable_manual_linking = true
[auth.rate_limit]
anonymous_users = 1000
[auth.email]
enable_signup = false
[analytics]
enabled = false
[edge_runtime]
enabled = false

# Enable only after creating the OAuth web client; secrets live in ignored app/.env.
[auth.external.google]
enabled = false
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_SECRET)"
skip_nonce_check = false
