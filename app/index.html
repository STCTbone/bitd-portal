<!doctype html>
<html lang="en" class="dark" data-design="signal">

    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blades ’68</title>

      try {
        const design = localStorage.getItem('bitd.design')
        if (['paperback', 'signal', 'blue-hour', 'midnight'].includes(design)) document.documentElement.dataset.design = design
      } catch { /* Appearance remains available without browser storage. */ }
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
